<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM Teleport Menu</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Custom Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: transparent;
        }

        #ui-container {
            --bg-primary: #111827;
            --bg-secondary: #1f2937;
            --bg-tertiary: #374151;
            --bg-interactive: #4b5563;
            --border-primary: #374151;
            --border-secondary: #4b5563;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --accent: #3b82f6;
            --accent-text: #ffffff;
            --glow-color: rgba(59, 130, 246, 0.3);
        }
        
        #ui-container, main { background-color: var(--bg-primary); }
        .bg-themed-secondary { background-color: var(--bg-secondary); }
        .item-card { background-color: var(--bg-secondary); border-color: var(--border-primary); }
        header { border-bottom-color: var(--border-primary); }
        .nav-link.active { color: var(--accent); border-bottom-color: var(--accent); }
        .nav-link:not(.active) { border-bottom-color: transparent; }
        .btn-glow { background-color: var(--accent); color: var(--accent-text); box-shadow: 0 4px 14px 0 var(--glow-color); }
        .btn-glow:hover { box-shadow: 0 6px 20px 0 var(--glow-color); }
        h1, h2, h3, p, label, input, span, div, td, th { color: var(--text-primary); }
        .text-themed-secondary, p.text-sm, th { color: var(--text-secondary); }
        .border-themed-primary { border-color: var(--border-primary); }
        .bg-themed-interactive { background-color: var(--bg-interactive); border-color: var(--border-secondary); }
        
        .main-content { -ms-overflow-style: none; scrollbar-width: none; }
        .main-content::-webkit-scrollbar { display: none; }
        
        .nav-link { transition: color 0.2s ease-out, border-color 0.2s ease-out; cursor: pointer; }
        .item-card { transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .item-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        .btn-glow { transition: transform 0.2s ease-out, box-shadow 0.2s ease-out; cursor: pointer; }
        .btn-glow:hover { transform: scale(1.05); }

        .ipad-frame {
            background: linear-gradient(145deg, #222, #111);
            box-shadow: 
                inset 0 0 4px 2px rgba(255, 255, 255, 0.05),
                0 30px 60px -15px rgba(0, 0, 0, 0.75),
                0 0 10px rgba(0,0,0,0.5);
            opacity: 0; 
            transform: scale(0.95);
        }
        .ipad-frame.animate {
            animation: fadeInScale 0.8s cubic-bezier(0.25, 0.8, 0.25, 1) 0.2s forwards;
        }
        .ipad-screen { box-shadow: inset 0 4px 10px rgba(0,0,0,0.7); }
        .camera-lens { background: radial-gradient(circle at 30% 30%, #3a3a42, #101012); box-shadow: inset 0 0 1px rgba(0,0,0,0.5); }

        @keyframes fadeInScale { to { opacity: 1; transform: scale(1); } }
        .animated { opacity: 0; animation-fill-mode: forwards; }
        .fade-in-up { animation: fadeInUp 0.6s cubic-bezier(0.25, 0.8, 0.25, 1) forwards; }
        .staggered-fade-in > * { opacity: 0; animation: fadeInUp 0.6s cubic-bezier(0.25, 0.8, 0.25, 1) forwards; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(25px); } to { opacity: 1; transform: translateY(0); } }

        body { display: none; }
        body.show { display: flex; }

    </style>
</head>
<body class="bg-transparent text-gray-200 min-h-screen p-8 antialiased flex items-center justify-center">
    <div class="ipad-frame relative mx-auto my-8 p-2.5 rounded-[40px]" style="width: 1180px; height: 820px;">
        <div class="ipad-screen w-full h-full bg-black rounded-[28px] overflow-hidden relative">
            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-6 bg-black rounded-b-xl flex justify-center items-center pt-1 z-20">
                <div class="w-3 h-3 rounded-full camera-lens"></div>
            </div>
            
            <div id="ipad-intro-screen" class="absolute inset-0 bg-black flex flex-col items-center justify-center z-20 transition-opacity duration-800 ease-out pointer-events-none">
                 <img src="https://r2.fivemanage.com/reN0iza3vc4oGjJ0nDgay/watermark.png" class="w-48 h-auto transition-all duration-1000 ease-out opacity-0 scale-90" id="intro-logo" alt="Intro Logo"/>
                 <h1 id="intro-text" class="text-2xl font-bold mt-4 opacity-0 transition-opacity duration-500">TPMENU</h1>
            </div>

            <div id="ui-container" class="w-full h-full flex flex-col overflow-hidden opacity-0 transition-opacity duration-1000 ease-in-out">
                <header class="w-full p-4 px-8 flex justify-between items-center border-b animated fade-in-up">
                    <h1 class="font-extrabold text-xl tracking-tight">FEARX TPMENU</h1>
                    <nav class="flex items-center gap-6">
                        <a href="#" data-page="general" class="nav-link active font-semibold text-base border-b-2 pb-1">General</a>
                        <a href="#" data-page="jobs" class="nav-link font-semibold text-base border-b-2 pb-1">Jobs</a>
                        <a href="#" data-page="gangs" class="nav-link font-semibold text-base border-b-2 pb-1">Gangs</a>
                        <a href="#" data-page="admin" class="nav-link font-semibold text-base border-b-2 pb-1" id="admin-nav">Admin</a>
                    </nav>
                     <div class="flex items-center gap-4">
                        <div class="text-right">
                            <h2 class="font-bold text-base" id="player-name">John Doe</h2>
                            <p class="text-sm text-themed-secondary" id="player-role">Citizen</p>
                        </div>
                        <div class="relative">
                            <img src="https://placehold.co/40x40/3b82f6/ffffff?text=J" alt="Profile" class="rounded-full" id="player-avatar">
                        </div>
                    </div>
                </header>

                <main class="flex-1 p-8 overflow-y-auto main-content">
                    <div id="general" class="page hidden">
                         <div id="general-grid" class="grid grid-cols-3 gap-6 staggered-fade-in"></div>
                    </div>
                    <div id="jobs" class="page hidden">
                         <div id="jobs-grid" class="grid grid-cols-3 gap-6 staggered-fade-in"></div>
                    </div>
                    <div id="gangs" class="page hidden">
                         <div id="gangs-grid" class="grid grid-cols-3 gap-6 staggered-fade-in"></div>
                    </div>
                    <div id="admin" class="page hidden">
                         <div id="admin-grid" class="grid grid-cols-3 gap-6 staggered-fade-in"></div>
                    </div>
                </main>
            </div>
            <div class="absolute bottom-2.5 left-1/2 -translate-x-1/2 w-40 h-1.5 bg-gray-700 rounded-full opacity-75"></div>
        </div>
    </div>
    
<script>
let menuData = null;
let currentCategory = 'general';

// NUI Message Handler
window.addEventListener('message', function(event) {
    const data = event.data;
    
    if (data.action === 'openMenu') {
        menuData = data.data;
        document.body.classList.add('show');
        // Trigger iPad frame animation
        const ipadFrame = document.querySelector('.ipad-frame');
        if (ipadFrame) {
            ipadFrame.classList.add('animate');
        }
        initializeMenu();
    } else if (data.action === 'closeMenu') {
        document.body.classList.remove('show');
        // Remove animation class for next open
        const ipadFrame = document.querySelector('.ipad-frame');
        if (ipadFrame) {
            ipadFrame.classList.remove('animate');
        }
    }
});

// Initialize menu with data
function initializeMenu() {
    if (!menuData) return;
    
    // Update player info
    document.getElementById('player-name').textContent = menuData.playerInfo.name;
    document.getElementById('player-role').textContent = menuData.playerInfo.role;
    
    // Update avatar with first letter
    const firstLetter = menuData.playerInfo.name.charAt(0).toUpperCase();
    document.getElementById('player-avatar').src = `https://placehold.co/40x40/3b82f6/ffffff?text=${firstLetter}`;
    
    // Hide admin tab if not admin
    if (!menuData.isAdmin) {
        document.getElementById('admin-nav').style.display = 'none';
    }
    
    // Run intro animation
    runIntroAnimation();
    
    // Show initial page
    showPage('general');
}

// Intro Animation
function runIntroAnimation() {
    const ipadIntro = document.getElementById('ipad-intro-screen');
    const introLogo = document.getElementById('intro-logo');
    const introText = document.getElementById('intro-text');
    const uiContainer = document.getElementById('ui-container');

    setTimeout(() => {
        introLogo.style.opacity = '1';
        introLogo.style.transform = 'scale(1)';
    }, 100);
    
    setTimeout(() => {
        introText.style.opacity = '1';
    }, 600);

    setTimeout(() => {
        ipadIntro.style.opacity = '0';
        uiContainer.style.opacity = '1';
    }, 2500);

    setTimeout(() => {
        ipadIntro.remove();
    }, 3300);
}

// Show page
function showPage(pageId) {
    const pages = document.querySelectorAll('.page');
    pages.forEach(page => page.classList.add('hidden'));
    
    const newPage = document.getElementById(pageId);
    if (newPage) {
        newPage.classList.remove('hidden');
        currentCategory = pageId;
        renderLocations(pageId);
    }
}

// Render locations
function renderLocations(category) {
    if (!menuData || !menuData.locations) return;
    
    const grid = document.getElementById(`${category}-grid`);
    grid.innerHTML = '';
    
    const data = menuData.locations[category] || [];

    if (data.length === 0) {
        grid.innerHTML = `<p class="text-themed-secondary col-span-3 text-center">No locations available in this category.</p>`;
        return;
    }

    data.forEach((loc, i) => {
        const card = document.createElement('div');
        card.className = 'item-card border rounded-xl overflow-hidden';
        card.style.animationDelay = `${i * 50}ms`;
        card.innerHTML = `
            <div class="h-40 bg-black/20 flex items-center justify-center p-2">
                <img src="${loc.image}" alt="${loc.name}" class="w-full h-full object-cover">
            </div>
            <div class="p-4">
                <h3 class="font-bold text-xl">${loc.name}</h3>
                <button class="teleport-btn btn-glow w-full mt-4 py-2 rounded-lg font-bold" data-category="${category}" data-location-name="${loc.name}">Teleport</button>
            </div>
        `;
        grid.appendChild(card);
    });
}

// Event Listeners
document.addEventListener('DOMContentLoaded', () => {
    // Navigation
    const navLinks = document.querySelectorAll('.nav-link');
    navLinks.forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault();
            navLinks.forEach(l => l.classList.remove('active'));
            link.classList.add('active');
            showPage(link.dataset.page);
        });
    });

    // Teleport buttons
    document.addEventListener('click', (e) => {
        if (e.target.classList.contains('teleport-btn')) {
            const category = e.target.dataset.category;
            const locationName = e.target.dataset.locationName;
            
            // Send to client
            post('teleport', {
                category: category,
                locationName: locationName
            }).catch(() => {});
        }
    });

    // Close on ESC
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            post('closeMenu', {}).catch(() => {});
        }
    });
});

// Post to NUI callback
function post(url, data = {}) {
    return fetch(`https://fearx-tpmenu/${url}`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json; charset=UTF-8',
        },
        body: JSON.stringify(data)
    });
}
</script>
</body>
</html>
